<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tree suggestions — Aire Ropa and Complentos, 13, Calle Alfalfa, Alfalfa, Casco Antiguo, Sevilla, An</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root {
    --ink: #12202b;
    --muted: #5b6b76;
    --paper: #f4f1ea;
    --card: #fffdf8;
    --line: #d9d1c3;
    --today: #1f6f4a;
    --future: #c05621;
    --blocked: #9b2c2c;
    --warn: #b7791f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    background: var(--paper);
    color: var(--ink);
  }
  header {
    padding: 18px 28px 8px;
    border-bottom: 1px solid var(--line);
    background: #efe8d8;
  }
  header h1 { margin: 0 0 4px; font-size: 1.45rem; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .layout {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(380px, 420px);
    min-height: calc(100vh - 88px);
  }
  #map { min-height: 420px; background: #cdd9c8; }
  aside {
    padding: 18px 22px 32px;
    overflow: auto;
    border-left: 1px solid var(--line);
    background: var(--card);
  }
  .note { font-size: 0.88rem; color: var(--muted); margin: 8px 0 14px; line-height: 1.4; }
  .mix { display: flex; height: 18px; border-radius: 9px; overflow: hidden; background: #ece6da; margin: 8px 0 4px; }
  .mix span { display: block; height: 100%; }
  .legend { font-size: 0.78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 16px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
  .status {
    display: inline-block;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .status.plantable { background: #d9eddf; color: #1f6f4a; }
  .status.city, .status.farm { background: #f6e4c1; color: #8a5a10; }
  .status.blocked { background: #f4d6d6; color: var(--blocked); }
  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px 10px;
    margin: 0 0 12px;
    background: #fff;
  }
  .card h2 { margin: 0 0 2px; font-size: 1.05rem; }
  .latin { color: var(--muted); font-size: 0.82rem; font-style: italic; }
  .badge {
    float: right;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 7px;
    border-radius: 999px;
    background: #e7f3ec;
    color: var(--today);
  }
  .badge.risky { background: #f8e6d8; color: var(--future); }
  .row { display: grid; grid-template-columns: 52px 1fr 44px; gap: 8px; align-items: center; font-size: 0.82rem; margin-top: 6px; }
  .track { height: 9px; background: #eee8dc; border-radius: 6px; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 6px; }
  .track.today i { background: var(--today); }
  .track.future i { background: var(--future); }
  .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .why, .care { font-size: 0.88rem; line-height: 1.35; margin: 8px 0 0; }
  .care { color: var(--muted); }
  .warn { color: var(--blocked); font-size: 0.85rem; margin-top: 6px; }
  .future-line { font-size: 0.85rem; margin-top: 6px; color: #7a3e12; }
  footer { font-size: 0.75rem; color: var(--muted); margin-top: 18px; line-height: 1.35; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    #map { height: 320px; }
  }
</style>
</head>
<body>
<header>
  <h1>Tree suggestions</h1>
  <p id="place"></p>
</header>
<div class="layout">
  <div id="map"></div>
  <aside id="panel"></aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA = {"lat": 37.39, "lon": -5.99, "country": "ES", "site": "This location looks warm (yearly average about 18°C), moderately wet (536 mm rain/year), alkaline soil (pH 7.8), average drainage, about 26 m above sea level.", "cell": {"west": -6.0, "south": 37.333333, "east": -5.833333, "north": 37.5, "status": "plantable", "color": "#1f6f4a"}, "satellite": {"blocked": false, "notes": [], "values": {"exclusion": 0.008435, "water": 0.008435, "snow": 0.0, "built": 0.289561, "crop": 0.413635, "tree": 0.152278}}, "goal": "shade", "sun": "any", "n_models": 152, "future": {"available": true, "path": "climate_future_2050/wc2.1_10m_bioc_MPI-ESM1-2-HR_ssp245_2041-2060.tif", "period": "2041-2060", "ssp": "ssp245", "gcm": "MPI-ESM1-2-HR", "note": null}, "picks": [{"species": "Pinus halepensis", "common_name": "Aleppo pine", "p": 0.910811, "p_2050": 0.739312, "delta": -0.171499, "future_note": "Climate match drops by 17% by 2050 — same soil, warmer climate.", "auc": 0.960199, "n_folds": 5, "rank_score": 0.874559, "confidence": "Great match", "reason": "Aleppo pine is a strong climate-and-soil match for your warm climate.", "care": "Drought-tough Mediterranean pine. Good on dry, limestone slopes.", "warning": "", "native": "Fits this region’s native range (coarse check).", "goals": "beauty,shade", "evergreen": "yes"}, {"species": "Pinus canariensis", "common_name": "Canary Island pine", "p": 0.741543, "p_2050": 0.702727, "delta": -0.038815, "future_note": "Still a strong climate match in 2050 (ssp245).", "auc": 0.978449, "n_folds": 5, "rank_score": 0.725561, "confidence": "Great match", "reason": "Canary Island pine is a strong climate-and-soil match for your warm climate.", "care": "Drought-tough once established. Popular street tree in warm-summer climates.", "warning": "", "native": "Not native to this region — fine as an ornamental if local rules allow.", "goals": "beauty,shade", "evergreen": "yes"}, {"species": "Pinus pinea", "common_name": "Italian stone pine", "p": 0.661866, "p_2050": 0.661866, "delta": 0.0, "future_note": "2050 climate is close enough that the ranking barely moves.", "auc": 0.970863, "n_folds": 4, "rank_score": 0.642581, "confidence": "Good match", "reason": "Italian stone pine can work in your warm climate, with some care.", "care": "The pine-nut pine. Needs heat, sun, and well-drained soil.", "warning": "", "native": "Fits this region’s native range (coarse check).", "goals": "food,beauty,shade", "evergreen": "yes"}, {"species": "Pinus brutia", "common_name": "Turkish pine", "p": 0.657021, "p_2050": 0.620856, "delta": -0.036165, "future_note": "2050 climate is close enough that the ranking barely moves.", "auc": 0.952187, "n_folds": 5, "rank_score": 0.625607, "confidence": "Good match", "reason": "Turkish pine can work in your warm climate, with some care.", "care": "Needs sun and soil that drains. Do not keep the roots soggy.", "warning": "", "native": "Fits this region’s native range (coarse check).", "goals": "beauty,shade", "evergreen": "yes"}, {"species": "Quercus canariensis", "common_name": "Algerian oak", "p": 0.68799, "p_2050": 0.68799, "delta": 0.0, "future_note": "2050 climate is close enough that the ranking barely moves.", "auc": 0.873024, "n_folds": 4, "rank_score": 0.600632, "confidence": "Good match", "reason": "Algerian oak can work in your warm climate, with some care.", "care": "Give it room and a deep soak while young. Oaks often resent compacted or constantly wet soil.", "warning": "", "native": "Fits this region’s native range (coarse check).", "goals": "shade,beauty", "evergreen": "no"}], "address": "Aire Ropa & Complentos, 13, Calle Alfalfa, Alfalfa, Casco Antiguo, Sevilla, Andalucía, 41004, España"};

function pct(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  return Math.round(v * 100) + "%";
}
function clamp01(v) { return Math.max(0, Math.min(1, v || 0)); }

const place = DATA.address || (DATA.lat.toFixed(3) + ", " + DATA.lon.toFixed(3));
document.getElementById("place").textContent = place
  + (DATA.goal && DATA.goal !== "any" ? " · goal: " + DATA.goal : "");

const cell = DATA.cell || {};
const status = cell.status || "plantable";
const color = cell.color || "#1f6f4a";
const map = L.map("map", { scrollWheelZoom: true });
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles &copy; Esri",
  maxZoom: 12
}).addTo(map);
if (cell.south !== undefined) {
  const bounds = [[cell.south, cell.west], [cell.north, cell.east]];
  L.rectangle(bounds, { color, weight: 2, fillColor: color, fillOpacity: 0.28 }).addTo(map);
  map.fitBounds(bounds, { padding: [40, 40], maxZoom: 8 });
} else {
  map.setView([DATA.lat, DATA.lon], 7);
}
L.marker([DATA.lat, DATA.lon]).addTo(map)
  .bindPopup("Score is for this ~18 km climate cell, not a backyard.");

const sat = (DATA.satellite && DATA.satellite.values) || {};
const parts = [
  ["water", sat.water, "#3b82f6"],
  ["built", sat.built, "#6b7280"],
  ["crop", sat.crop, "#ca8a04"],
  ["tree", sat.tree, "#16a34a"],
  ["snow", sat.snow, "#94a3b8"]
];
let used = 0;
let mixHtml = "";
let legend = "";
parts.forEach(([name, val, col]) => {
  const v = clamp01(val);
  if (v < 0.02) return;
  used += v;
  mixHtml += `<span style="width:${v*100}%;background:${col}" title="${name} ${pct(v)}"></span>`;
  legend += `<span><i style="background:${col}"></i>${name} ${pct(v)}</span>`;
});
const other = Math.max(0, 1 - used);
if (other > 0.02) {
  mixHtml += `<span style="width:${other*100}%;background:#e7e1d4" title="other ${pct(other)}"></span>`;
  legend += `<span><i style="background:#e7e1d4"></i>other ${pct(other)}</span>`;
}

const notes = ((DATA.satellite && DATA.satellite.notes) || []).map(n => `<div class="note">${n}</div>`).join("");
const blocked = DATA.satellite && DATA.satellite.blocked;
const futureMeta = DATA.future || {};
let cards = "";
if (blocked) {
  cards = `<p class="warn">No planting list — satellite says this pin is not plantable.</p>`;
} else if (!DATA.picks || !DATA.picks.length) {
  cards = `<p class="note">No species cleared the match + goal filters.</p>`;
} else {
  DATA.picks.forEach((p, i) => {
    const risky = p.confidence === "Risky" ? " risky" : "";
    const fut = (p.p_2050 === null || p.p_2050 === undefined)
      ? ""
      : `<div class="row"><span>2050</span><div class="track future"><i style="width:${clamp01(p.p_2050)*100}%"></i></div><span class="pct">${pct(p.p_2050)}</span></div>
         <div class="future-line">${p.future_note || ""}</div>`;
    cards += `<article class="card">
      <span class="badge${risky}">${p.confidence || ""}</span>
      <h2>${i+1}. ${p.common_name}</h2>
      <div class="latin">${p.species}</div>
      <div class="row"><span>Today</span><div class="track today"><i style="width:${clamp01(p.p)*100}%"></i></div><span class="pct">${pct(p.p)}</span></div>
      ${fut}
      <p class="why">${p.reason || ""}</p>
      <p class="care">${p.native || ""} ${p.care || ""}</p>
      ${p.warning ? `<p class="warn">${p.warning}</p>` : ""}
    </article>`;
  });
}

document.getElementById("panel").innerHTML = `
  <div class="status ${status}">${status.replace("_", " ")} cell</div>
  <p>${DATA.site || ""}</p>
  <p class="note">The box on the map is one 1/6° cell (~18 km). Shade, frost pockets and watering in a yard are not in the model.</p>
  ${mixHtml ? `<div class="mix">${mixHtml}</div><div class="legend">${legend}</div>` : ""}
  ${notes}
  ${cards}
  <footer>
    Suitability <em>p</em> is P(this climate–soil cell looks like recorded habitat), not a planting permit.
    ${futureMeta.available
      ? "2050 uses CMIP6 " + (futureMeta.ssp || "ssp245") + " " + (futureMeta.period || "2041–2060") + "; soil and elevation stay as they are. Same XGBoost models, new BIO values — not a second training run."
      : "2050 bars omitted (future climate GeoTIFF not on disk)."}
    Tree cover is a satellite filter, not an XGBoost feature.
  </footer>
`;
</script>
</body>
</html>
