<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tree suggestions — Charles Schwab, 501, Congress Avenue, Downtown, Austin, Travis County, Texas, 78</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root {
    --ink: #12202b;
    --muted: #5b6b76;
    --paper: #f4f1ea;
    --card: #fffdf8;
    --line: #d9d1c3;
    --today: #1f6f4a;
    --future: #c05621;
    --blocked: #9b2c2c;
    --warn: #b7791f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    background: var(--paper);
    color: var(--ink);
  }
  header {
    padding: 18px 28px 8px;
    border-bottom: 1px solid var(--line);
    background: #efe8d8;
  }
  header h1 { margin: 0 0 4px; font-size: 1.45rem; font-weight: 600; }
  header p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .layout {
    display: grid;
    grid-template-columns: minmax(320px, 1fr) minmax(380px, 420px);
    min-height: calc(100vh - 88px);
  }
  #map { min-height: 420px; background: #cdd9c8; }
  aside {
    padding: 18px 22px 32px;
    overflow: auto;
    border-left: 1px solid var(--line);
    background: var(--card);
  }
  .note { font-size: 0.88rem; color: var(--muted); margin: 8px 0 14px; line-height: 1.4; }
  .mix { display: flex; height: 18px; border-radius: 9px; overflow: hidden; background: #ece6da; margin: 8px 0 4px; }
  .mix span { display: block; height: 100%; }
  .legend { font-size: 0.78rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 16px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
  .status {
    display: inline-block;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .status.plantable { background: #d9eddf; color: #1f6f4a; }
  .status.city, .status.farm { background: #f6e4c1; color: #8a5a10; }
  .status.blocked { background: #f4d6d6; color: var(--blocked); }
  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px 10px;
    margin: 0 0 12px;
    background: #fff;
  }
  .card h2 { margin: 0 0 2px; font-size: 1.05rem; }
  .latin { color: var(--muted); font-size: 0.82rem; font-style: italic; }
  .badge {
    float: right;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 7px;
    border-radius: 999px;
    background: #e7f3ec;
    color: var(--today);
  }
  .badge.risky { background: #f8e6d8; color: var(--future); }
  .row { display: grid; grid-template-columns: 52px 1fr 44px; gap: 8px; align-items: center; font-size: 0.82rem; margin-top: 6px; }
  .track { height: 9px; background: #eee8dc; border-radius: 6px; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 6px; }
  .track.today i { background: var(--today); }
  .track.future i { background: var(--future); }
  .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .why, .care, .fi { font-size: 0.88rem; line-height: 1.35; margin: 8px 0 0; }
  .fi { color: var(--muted); font-size: 0.8rem; }
  .care { color: var(--muted); }
  .warn { color: var(--blocked); font-size: 0.85rem; margin-top: 6px; }
  .future-line { font-size: 0.85rem; margin-top: 6px; color: #7a3e12; }
  footer { font-size: 0.75rem; color: var(--muted); margin-top: 18px; line-height: 1.35; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    #map { height: 320px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="headline">Tree suggestions</h1>
  <p id="place"></p>
</header>
<div class="layout">
  <div id="map"></div>
  <aside id="panel"></aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA = {"title": "Trees that look like recorded sites here", "lat": 30.2672, "lon": -97.7431, "country": "US", "site": "This location looks warm (yearly average about 21°C), wet (807 mm rain/year), alkaline soil (pH 7.6), average drainage, about 157 m above sea level.", "cell": {"west": -97.75, "south": 30.266667, "east": -97.741667, "north": 30.275, "status": "city", "color": "#b7791f"}, "grid": {"label": "1 km", "marker": "Score is for this ~1 km cell vs other listed trees, not a backyard.", "note": "The box is one 30-arc-second cell (~1 km). p is record-likeness: how much this 1 km cell looks like GBIF records of that species versus other listed trees (target-group background). It is not a planting permit, survival odds, or a backyard shade model. Yard shade, frost pockets and watering are not in the model."}, "satellite": {"blocked": false, "notes": ["6 soil/terrain layer(s) have no value in this 1 km cell (nitrogen_0-30cm_30s.tif, nitrogen_30-60cm_30s.tif, cec_0-30cm_30s.tif, cec_30-60cm_30s.tif, cfvo_0-30cm_30s.tif, cfvo_30-60cm_30s.tif); XGBoost treats those as missing rather than as average soil.", "Satellite mix is ESA WorldCover class fractions on this 1 km cell, not the global 18 km filters.", "This cell is largely built-up city. (satellite built-up ≈ 97%)"], "values": {"exclusion": 0.0, "water": 0.0, "snow": 0.0, "built": 0.9744, "crop": 0.0, "tree": 0.0256}}, "goal": "shade", "sun": "any", "n_models": 31, "importance_caption": "Species-wide XGBoost gain (all US training cells), not why this pin scored:", "disclaimer": "p is record-likeness: how much this 1 km cell looks like GBIF records of that species versus other listed trees (target-group background). It is not a planting permit, survival odds, or a backyard shade model.", "future": {"available": true, "path": "/home/AMD/dgoplani/hackathon_2026/data/country_data/USA/climate_future_2050_30s", "period": "2041-2060", "ssp": "ssp245", "gcm": "MPI-ESM1-2-HR", "note": null}, "picks": [{"species": "Taxodium distichum", "common_name": "Bald cypress", "p": 0.753733, "p_2050": 0.763895, "delta": 0.010163, "future_note": "2050 BIO still looks like this species' records (ssp245, one GCM).", "auc": 0.889548, "n_folds": 5, "rank_score": 0.670482, "confidence": "Looks like records", "reason": "Bald cypress: this 1 km cell looks more like GBIF records of this species than like other listed trees, given your warm climate.", "feature_importance": [{"name": "vapr_annual_mean.tif", "label": "vapr annual mean", "share": 0.1583}, {"name": "elev_max.tif", "label": "highest elevation in cell", "share": 0.0907}, {"name": "elev_mean.tif", "label": "elevation", "share": 0.0855}, {"name": "wc2.1_30s_bio_10.tif", "label": "warm-quarter temperature", "share": 0.0762}, {"name": "wc2.1_30s_bio_14.tif", "label": "driest-month rainfall", "share": 0.0309}], "care": "Plant in a hole no deeper than the root flare; water in the first two summers.", "warning": "", "native": "Fits this region’s native range (coarse check).", "goals": "shade,beauty", "evergreen": "no"}, {"species": "Platanus occidentalis", "common_name": "American sycamore", "p": 0.809429, "p_2050": 0.798509, "delta": -0.010919, "future_note": "2050 BIO still looks like this species' records (ssp245, one GCM).", "auc": 0.793075, "n_folds": 5, "rank_score": 0.641938, "confidence": "Somewhat like records", "reason": "American sycamore: this 1 km cell looks more like GBIF records of this species than like other listed trees, given your warm climate.", "feature_importance": [{"name": "wc2.1_30s_bio_14.tif", "label": "driest-month rainfall", "share": 0.1291}, {"name": "vapr_annual_mean.tif", "label": "vapr annual mean", "share": 0.0994}, {"name": "wc2.1_30s_bio_17.tif", "label": "dry-quarter rainfall", "share": 0.0639}, {"name": "wc2.1_30s_bio_5.tif", "label": "hottest-month temperature", "share": 0.063}, {"name": "wc2.1_30s_bio_4.tif", "label": "temperature seasonality", "share": 0.0449}], "care": "Plant in a hole no deeper than the root flare; water in the first two summers.", "warning": "", "native": "Fits this region’s native range (coarse check).", "goals": "shade,beauty", "evergreen": "no"}, {"species": "Quercus virginiana", "common_name": "Southern live oak", "p": 0.674744, "p_2050": 0.703013, "delta": 0.028269, "future_note": "2050 BIO still looks like this species' records (ssp245, one GCM).", "auc": 0.949514, "n_folds": 5, "rank_score": 0.640679, "confidence": "Somewhat like records", "reason": "Southern live oak: this cell is somewhat like recorded sites of this species (your warm climate). Not a planting permit.", "feature_importance": [{"name": "vapr_annual_mean.tif", "label": "vapr annual mean", "share": 0.2412}, {"name": "wc2.1_30s_bio_1.tif", "label": "yearly temperature", "share": 0.12}, {"name": "wc2.1_30s_bio_6.tif", "label": "coldest-month temperature", "share": 0.0884}, {"name": "wc2.1_30s_bio_11.tif", "label": "cold-quarter temperature", "share": 0.0851}, {"name": "wc2.1_30s_bio_10.tif", "label": "warm-quarter temperature", "share": 0.0708}], "care": "Give it room and a deep soak while young. Oaks often resent compacted or constantly wet soil.", "warning": "", "native": "Fits this region’s native range (coarse check).", "goals": "shade,beauty", "evergreen": "no"}, {"species": "Ulmus americana", "common_name": "American elm", "p": 0.572115, "p_2050": 0.582812, "delta": 0.010697, "future_note": "2050 BIO barely moves this species' record-likeness.", "auc": 0.76699, "n_folds": 5, "rank_score": 0.438807, "confidence": "Somewhat like records", "reason": "American elm: this cell is somewhat like recorded sites of this species (your warm climate). Not a planting permit.", "feature_importance": [{"name": "wc2.1_30s_bio_18.tif", "label": "warm-quarter rainfall", "share": 0.1442}, {"name": "elev_max.tif", "label": "highest elevation in cell", "share": 0.0915}, {"name": "cfvo_0-30cm_30s.tif", "label": "stones (surface)", "share": 0.0884}, {"name": "wc2.1_30s_bio_14.tif", "label": "driest-month rainfall", "share": 0.0813}, {"name": "cfvo_30-60cm_30s.tif", "label": "stones (subsoil)", "share": 0.0665}], "care": "Plant in a hole no deeper than the root flare; water in the first two summers.", "warning": "", "native": "Fits this region’s native range (coarse check).", "goals": "shade,beauty", "evergreen": "no"}, {"species": "Juniperus virginiana", "common_name": "Eastern red cedar", "p": 0.545914, "p_2050": 0.64011, "delta": 0.094196, "future_note": "2050 BIO barely moves this species' record-likeness.", "auc": 0.781605, "n_folds": 5, "rank_score": 0.426689, "confidence": "Somewhat like records", "reason": "Eastern red cedar: this cell is somewhat like recorded sites of this species (your warm climate). Not a planting permit.", "feature_importance": [{"name": "vapr_annual_mean.tif", "label": "vapr annual mean", "share": 0.147}, {"name": "wc2.1_30s_bio_18.tif", "label": "warm-quarter rainfall", "share": 0.1371}, {"name": "wc2.1_30s_bio_14.tif", "label": "driest-month rainfall", "share": 0.0615}, {"name": "wc2.1_30s_bio_10.tif", "label": "warm-quarter temperature", "share": 0.0514}, {"name": "wc2.1_30s_bio_5.tif", "label": "hottest-month temperature", "share": 0.043}], "care": "Plant in a hole no deeper than the root flare; water in the first two summers.", "warning": "", "native": "Fits this region’s native range (coarse check).", "goals": "shade,beauty", "evergreen": "no"}], "avoid": [], "address": "Charles Schwab, 501, Congress Avenue, Downtown, Austin, Travis County, Texas, 78701, United States"};

function pct(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  return Math.round(v * 100) + "%";
}
function clamp01(v) { return Math.max(0, Math.min(1, v || 0)); }

const coords = (typeof DATA.lat === "number" && typeof DATA.lon === "number")
  ? DATA.lat.toFixed(4) + ", " + DATA.lon.toFixed(4)
  : "";
const place = [DATA.address, coords, DATA.goal && DATA.goal !== "any" ? "goal: " + DATA.goal : ""]
  .filter(Boolean).join("  ·  ");
document.getElementById("headline").textContent = DATA.title || "Tree suggestions";
document.getElementById("place").textContent = place || coords;

const cell = DATA.cell || {};
const status = cell.status || "plantable";
const color = cell.color || "#1f6f4a";
const map = L.map("map", { scrollWheelZoom: true });
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  attribution: "Tiles &copy; Esri",
  maxZoom: 12
}).addTo(map);
if (cell.south !== undefined) {
  const bounds = [[cell.south, cell.west], [cell.north, cell.east]];
  L.rectangle(bounds, { color, weight: 2, fillColor: color, fillOpacity: 0.28 }).addTo(map);
  map.fitBounds(bounds, { padding: [40, 40], maxZoom: 8 });
} else {
  map.setView([DATA.lat, DATA.lon], 7);
}
const grid = DATA.grid || {};
const markerNote = grid.marker || "Score is for this ~18 km climate cell, not a backyard.";
L.marker([DATA.lat, DATA.lon]).addTo(map)
  .bindPopup(markerNote);

const sat = (DATA.satellite && DATA.satellite.values) || {};
const parts = [
  ["water", sat.water, "#3b82f6"],
  ["built", sat.built, "#6b7280"],
  ["crop", sat.crop, "#ca8a04"],
  ["tree", sat.tree, "#16a34a"],
  ["snow", sat.snow, "#94a3b8"]
];
let used = 0;
let mixHtml = "";
let legend = "";
parts.forEach(([name, val, col]) => {
  const v = clamp01(val);
  if (v < 0.02) return;
  used += v;
  mixHtml += `<span style="width:${v*100}%;background:${col}" title="${name} ${pct(v)}"></span>`;
  legend += `<span><i style="background:${col}"></i>${name} ${pct(v)}</span>`;
});
const other = Math.max(0, 1 - used);
if (other > 0.02) {
  mixHtml += `<span style="width:${other*100}%;background:#e7e1d4" title="other ${pct(other)}"></span>`;
  legend += `<span><i style="background:#e7e1d4"></i>other ${pct(other)}</span>`;
}

const notes = ((DATA.satellite && DATA.satellite.notes) || []).map(n => `<div class="note">${n}</div>`).join("");
const blocked = DATA.satellite && DATA.satellite.blocked;
const futureMeta = DATA.future || {};
let cards = "";
if (blocked) {
  cards = `<p class="warn">No planting list — satellite says this pin is not plantable.</p>`;
} else if (!DATA.picks || !DATA.picks.length) {
  cards = `<p class="note">No species cleared the record-likeness + goal filters.</p>`;
} else {
  DATA.picks.forEach((p, i) => {
    const risky = (p.confidence === "Risky" || p.confidence === "Weak likeness") ? " risky" : "";
    const fut = (p.p_2050 === null || p.p_2050 === undefined)
      ? ""
      : `<div class="row"><span>2050</span><div class="track future"><i style="width:${clamp01(p.p_2050)*100}%"></i></div><span class="pct">${pct(p.p_2050)}</span></div>
         <div class="future-line">${p.future_note || ""}</div>`;
    const fi = (p.feature_importance || []).slice(0, 5);
    const fiLead = DATA.importance_caption
      || "Species-wide XGBoost gain (not this pin):";
    const fiHtml = fi.length
      ? `<p class="fi">${fiLead} ${fi.map(x => x.label + " " + Math.round((x.share||0)*100) + "%").join(" · ")}</p>`
      : "";
    cards += `<article class="card">
      <span class="badge${risky}">${p.confidence || ""}</span>
      <h2>${i+1}. ${p.common_name}</h2>
      <div class="latin">${p.species}</div>
      <div class="row"><span>Today</span><div class="track today"><i style="width:${clamp01(p.p)*100}%"></i></div><span class="pct">${pct(p.p)}</span></div>
      ${fut}
      <p class="why">${p.reason || ""}</p>
      ${fiHtml}
      <p class="care">${p.native || ""} ${p.care || ""}</p>
      ${p.warning ? `<p class="warn">${p.warning}</p>` : ""}
    </article>`;
  });
}

const avoid = DATA.avoid || [];
let avoidHtml = "";
if (avoid.length) {
  avoidHtml = `<p class="warn">Do not plant — this cell looks like records of invasive or naturalised trees:</p>`
    + avoid.map(a => `<p class="warn">• ${a.common_name} <span class="latin">${a.species}</span> (p=${pct(a.p)})${a.warning ? " — " + a.warning : ""}</p>`).join("");
}

const disclaimer = DATA.disclaimer
  || "p is how much this climate–soil cell looks like recorded sites of that species, not a planting permit.";

document.getElementById("panel").innerHTML = `
  <div class="status ${status}">${status.replace("_", " ")} cell</div>
  <p>${DATA.site || ""}</p>
  <p class="note">${grid.note || "The box on the map is one 1/6° cell (~18 km). Shade, frost pockets and watering in a yard are not in the model."}</p>
  ${mixHtml ? `<div class="mix">${mixHtml}</div><div class="legend">${legend}</div>` : ""}
  ${notes}
  ${cards}
  ${avoidHtml}
  <footer>
    ${disclaimer}
    ${futureMeta.available
      ? "2050 uses CMIP6 " + (futureMeta.ssp || "ssp245") + " " + (futureMeta.period || "2041–2060") + "; soil and elevation stay as they are. Same XGBoost models, new BIO values — not a second training run."
      : "2050 bars omitted (future climate GeoTIFF not on disk)."}
    Feature-gain lines are species-wide XGBoost gain, not a local explanation of this pin.
    Tree cover is a satellite filter, not an XGBoost feature.
  </footer>
`;
</script>
</body>
</html>
